site_name: QualFM Project Documentation
site_description: Project documentation, design decisions, and time logs for QualFM website development
site_author: OneZeroNine

theme:
  name: material
  palette:
    primary: indigo
    accent: green
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate

nav:
  - Home: index.md
  - Project:
    - Overview: project/overview.md
    - Requirements: project/requirements.md
    - Competitor Research: project/competitor-research.md
  - Design:
    - Brand Guidelines: design/brand-guidelines.md
    - Site Structure: design/site-structure.md
    - Components: design/components.md
    - Design Decisions: design/decisions.md
  - Build:
    - Changelog: build/changelog.md
    - Technical Notes: build/technical-notes.md
  - Time Logs:
    - Billing Summary: time-logs/summary.md
    - Session Logs: time-logs/sessions.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
